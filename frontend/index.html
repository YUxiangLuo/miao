<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miao 控制面板</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1a1d22" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      // 主题引导：渲染前把显式主题落到 data-theme，避免闪烁（FOUC）。
      // 只有 dark/light 两态，默认 dark；键名与色值镜像 src/tokens.js
      // （THEME_KEY / THEME_META），改动需同步。
      try {
        var t = localStorage.getItem('miao-theme')
        if (t !== 'light') t = 'dark'
        document.documentElement.dataset.theme = t
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.content = t === 'light' ? '#eceef2' : '#1a1d22'
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // PWA：注册 SW 使面板可被安装为桌面应用。dev 服务器下 /sw.js 不存在，
      // 注册失败静默忽略，不影响开发。
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {})
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
