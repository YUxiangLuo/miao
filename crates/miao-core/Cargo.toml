[package]
name = "miao-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8", features = ["macros", "ws"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
yaml_serde = "0.10"
serde_json = "1.0"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream"], default-features = false }
urlencoding = "2.1.3"
futures = "0.3"
regex = "1"
url = "2.5"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"
subtle = "2"
semver = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arc-swap = "1.7"
bytes = "1.0"
# 定时刷新按系统本地时区解释 "HH:MM"；iana-time-zone 只用于展示时区名（chrono 已间接依赖）。
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
iana-time-zone = "0.1"
tokio-tungstenite = "0.29"
tempfile = "3"
ruzstd = "0.9"
jsonschema = { version = "0.57.0", default-features = false }
duckdb = { version = "1.10505.0", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "user"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Networking_WinSock",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
