[workspace]
resolver = "2"
members = ["crates/harbor-core", "crates/harbor-cli", "desktop/src-tauri"]
# Desktop pulls in webkit2gtk / WebView2. Keep it out of default `cargo test` / clippy.
default-members = ["crates/harbor-core", "crates/harbor-cli"]

[workspace.package]
version = "0.51.3"
edition = "2021"
license = "MIT"

# The Rust process serves the control plane; packet forwarding runs in Go.
# Keep unwinding for existing panic/error handling while reducing release size.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
