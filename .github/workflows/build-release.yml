name: Build Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  frontend:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build frontend
        run: ./scripts/build-frontend.sh

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: public/

  build-linux:
    runs-on: ubuntu-latest
    needs: frontend
    strategy:
      matrix:
        include:
          - target: amd64
            rust_target: x86_64-unknown-linux-musl
          - target: arm64
            rust_target: aarch64-unknown-linux-musl
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: public/

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Zig for cross-compilation
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Build sing-box and geo rule files
        run: MIAO_TARGET=${{ matrix.target }} ./scripts/build-embedded.sh

      - name: Build release for ${{ matrix.target }}
        run: cargo zigbuild --locked --release --target ${{ matrix.rust_target }}

      - name: Prepare release asset
        run: |
          mv target/${{ matrix.rust_target }}/release/miao-rust miao-rust-linux-${{ matrix.target }}
          ASSET="miao-rust-linux-${{ matrix.target }}"
          # GNU sha256sum 标准一行：`<hex>  <filename>`，供本机校验与程序解析
          sha256sum "$ASSET" | tee "${ASSET}.sha256"
          printf 'RELEASE_ASSET=%s\n' "$ASSET" >> "$GITHUB_ENV"
          printf 'RELEASE_SHA256=%s.sha256\n' "$ASSET" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miao-rust-${{ matrix.target }}
          path: |
            ${{ env.RELEASE_ASSET }}
            ${{ env.RELEASE_SHA256 }}

  build-windows:
    runs-on: windows-latest
    needs: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: public/

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build Windows sing-box and geo files
        shell: bash
        run: MIAO_TARGET=windows-amd64 ./scripts/build-embedded.sh

      - name: Smoke test the real Windows kernel
        run: ./embedded/sing-box-windows-amd64.exe version

      - name: Build desktop shell
        run: cargo build -p miao-desktop --locked --release

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2.11.4

      - name: Bundle NSIS installer
        working-directory: desktop/src-tauri
        run: npx --yes @tauri-apps/cli@2.11.4 build --bundles nsis --ci

      - name: Collect NSIS installer
        shell: bash
        run: |
          installer=$(find target/release/bundle/nsis -name '*.exe' | head -n 1)
          test -n "$installer"
          cp "$installer" miao-windows-amd64-setup.exe
          sha256sum miao-windows-amd64-setup.exe | tee miao-windows-amd64-setup.exe.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miao-windows-amd64
          path: |
            miao-windows-amd64-setup.exe
            miao-windows-amd64-setup.exe.sha256

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: miao-*
          merge-multiple: true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            miao-rust-linux-amd64
            miao-rust-linux-amd64.sha256
            miao-rust-linux-arm64
            miao-rust-linux-arm64.sha256
            miao-windows-amd64-setup.exe
            miao-windows-amd64-setup.exe.sha256
