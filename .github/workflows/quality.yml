name: Quality Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --cwd frontend --frozen-lockfile

      - name: Audit dependencies
        run: bun audit --cwd frontend

      - name: Lint
        run: bun run --cwd frontend lint

      - name: Test
        run: bun run --cwd frontend test

      - name: Build
        run: bun run --cwd frontend build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: quality-frontend
          path: public/

  rust:
    name: Rust quality
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: quality-frontend
          path: public/

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Prepare inert test assets
        run: |
          mkdir -p embedded
          printf '#!/bin/sh\nexit 1\n' > embedded/sing-box-amd64
          chmod 755 embedded/sing-box-amd64
          : > embedded/sing-box-windows-amd64.exe
          : > embedded/geoip-cn.srs
          : > embedded/geosite-geolocation-cn.srs
          : > embedded/adblock_reject.srs

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      - name: Audit dependencies
        run: cargo audit

      - name: Install MinGW for Windows cross-check
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Add Windows GNU target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Check miao-core for Windows
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: cargo check -p miao-core --locked --target x86_64-pc-windows-gnu

  windows:
    name: Windows desktop compile
    runs-on: windows-latest
    needs: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: quality-frontend
          path: public/

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare inert embedded assets
        shell: bash
        run: |
          mkdir -p embedded
          : > embedded/sing-box-windows-amd64.exe
          : > embedded/sing-box-amd64
          : > embedded/geoip-cn.srs
          : > embedded/geosite-geolocation-cn.srs
          : > embedded/adblock_reject.srs

      - name: Build desktop shell
        run: cargo build -p miao-desktop --locked --release
