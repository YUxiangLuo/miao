name: Quality Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --cwd frontend-rsbuild --frozen-lockfile

      - name: Audit dependencies
        run: bun audit --cwd frontend-rsbuild

      - name: Lint
        run: bun run --cwd frontend-rsbuild lint

      - name: Typecheck
        run: bun run --cwd frontend-rsbuild typecheck

      - name: Test
        run: bun run --cwd frontend-rsbuild test

      - name: Test kernel packaging tools
        run: bun test scripts

      - name: Build
        run: bun run --cwd frontend-rsbuild build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: quality-frontend
          path: public/

  kernel:
    name: Kernel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: amd64
          - os: ubuntu-latest
            target: arm64
          - os: windows-latest
            target: windows-amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Read pinned Go version
        shell: bash
        run: echo "GO_VER=$(bun scripts/sing-box/source.mjs go_version)" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VER }}
          cache-dependency-path: scripts/sing-box/source.json

      - name: Check Go test formatting
        shell: bash
        run: test -z "$(gofmt -l scripts/sing-box/tests/*.go)"

      - name: Test and build pinned client kernel
        shell: bash
        env:
          MIAO_TARGET: ${{ matrix.target }}
        run: ./scripts/build-embedded.sh --kernel-only

      - name: Smoke test native kernel
        if: matrix.target != 'arm64'
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == windows-amd64 ]]; then
            ./embedded/sing-box-windows-amd64.exe version
          else
            ./embedded/sing-box-amd64 version
          fi

      - name: Upload packed native kernel for Rust extraction tests
        if: matrix.target != 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: quality-kernel-${{ matrix.target }}
          path: |
            embedded/*.zst
            embedded/*.meta.json
          retention-days: 1
          if-no-files-found: error

  rust:
    name: Rust quality
    runs-on: ubuntu-latest
    needs: [frontend, kernel]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: quality-frontend
          path: public/

      - name: Download real Linux kernel for extraction tests
        uses: actions/download-artifact@v4
        with:
          name: quality-kernel-amd64
          path: embedded/

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Prepare missing cross-target and rule test assets
        run: bun scripts/prepare-test-assets.mjs

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      - name: Audit dependencies
        run: cargo audit

      - name: Install MinGW for Windows cross-check
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Add Windows GNU target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Check miao-core for Windows
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: cargo check -p miao-core --locked --target x86_64-pc-windows-gnu

  windows:
    name: Windows health check
    runs-on: windows-latest
    needs: [frontend, kernel]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: quality-frontend
          path: public/

      - name: Download real Windows kernel for extraction tests
        uses: actions/download-artifact@v4
        with:
          name: quality-kernel-windows-amd64
          path: embedded/

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Prepare missing cross-target and rule test assets
        shell: bash
        run: bun scripts/prepare-test-assets.mjs

      - name: Test miao-core
        run: cargo test -p miao-core --locked --all-targets

      # 健康检查即可：证明桌面壳能编过。完整 release 构建（真内核 + NSIS）由 Build Release 负责
      - name: Check desktop shell
        run: cargo check -p miao-desktop --locked
