name: CI

on:
  push:
    # Drop feat/windows-tauri from this list before merging to master.
    branches: [master, feat/windows-tauri]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
