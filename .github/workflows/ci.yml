name: CI

# 仓库转私密后不再使用 GitHub Actions，保留本工作流作为参考。
# 已移除 push / pull_request 触发，仅可手动 workflow_dispatch 运行。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
