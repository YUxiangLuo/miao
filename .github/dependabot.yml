version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly

  # Use the Bun ecosystem so dependency PRs update bun.lock as well as package.json.
  - package-ecosystem: bun
    directory: /frontend-rsbuild
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Coordinate framework/toolchain major upgrades manually instead of opening
    # incompatible single-package PRs (for example React without React DOM).
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
